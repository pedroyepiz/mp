<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006847">
  <meta name="description" content="Semblanza profesional del profesor Pedro Núñez Yepiz · El Profe Yepiz.">
  <title>El Profe Yepiz | UABC FIAD</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../styles/pages/paginas_uniformes.css">

  <style>
    /* =========================================================
       UNIFORMIDAD HTML · PROFE YEPIZ
       Se conserva exactamente el contenido original.
       ========================================================= */

    .page-profe-yepiz.pe-uniform-page{
      background:
        linear-gradient(180deg,#f3faf7 0%,#ffffff 34%,#f6fbf8 100%);
    }

    .page-profe-yepiz.pe-uniform-page .page-content-shell{
      padding-top:clamp(18px,3vw,34px) !important;
      padding-bottom:clamp(22px,4vw,42px) !important;
    }

    .page-profe-yepiz.pe-uniform-page .page-content-card{
      padding:clamp(10px,1.8vw,18px) !important;
      background:#ffffff;
      border:1px solid #cfe6dc;
      border-radius:18px;
      box-shadow:0 10px 28px rgba(0,80,56,.08);
      overflow:hidden;
    }

    .page-profe-yepiz.pe-uniform-page figure{
      margin:0;
    }

    .page-profe-yepiz.pe-uniform-page figure img{
      display:block;
      width:100%;
      height:auto;
      margin:0 auto;
      border-radius:14px !important;
      border:1px solid rgba(0,104,71,.10);
      box-shadow:0 6px 18px rgba(0,70,48,.08) !important;
    }

    /* Mejora móvil sin alterar la imagen ni su contenido */
    @media (max-width:767.98px){
      .page-profe-yepiz.pe-uniform-page .page-content-shell{
        padding-left:10px;
        padding-right:10px;
      }

      .page-profe-yepiz.pe-uniform-page .page-content-card{
        padding:7px !important;
        border-radius:14px;
      }

      .page-profe-yepiz.pe-uniform-page figure{
        overflow:auto;
        -webkit-overflow-scrolling:touch;
        border-radius:10px;
      }

      .page-profe-yepiz.pe-uniform-page figure img{
        width:auto;
        max-width:none;
        min-width:760px;
        height:auto;
        border-radius:10px !important;
      }
    }

    @media (max-width:420px){
      .page-profe-yepiz.pe-uniform-page figure img{
        min-width:700px;
      }
    }
  </style>

</head>

<body class="pe-home pe-course-page page-profe-yepiz pe-uniform-page">

  <!-- ENCABEZADO MAESTRO -->
  <div id="site-header"></div>

  <!-- SEMBLANZA COMPLETA -->
  <main class="container-fluid pe-shell page-content-shell py-4 py-lg-5">
    <div class="page-content-card p-2 p-md-3 p-xl-4">
      <figure class="m-0 text-center">
        <img
          src="../images/semblanza/profe_yepiz.webp"
          class="img-fluid w-100 rounded-3 shadow-sm"
          alt="Semblanza profesional de Pedro Núñez Yepiz, El Profe Yepiz"
          loading="eager">
      </figure>
    </div>
  </main>

  <!-- PIE DE PÁGINA MAESTRO -->
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <script src="../scripts/layout.js" defer></script>
</body>
</html>
